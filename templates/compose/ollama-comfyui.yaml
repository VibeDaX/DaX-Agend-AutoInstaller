services:
  ollama:
    image: "ollama/ollama:latest"
    volumes:
      - "ollama_data"
    ports:
      - "11434:11434"
    restart: unless-stopped

  comfyui:
    image: "ghcr.io/comfy-org/comfyui:latest"
    volumes:
      - "comfyui_data:/app/ComfyUI/output"
    ports:
      - "8188:8188"
    environment:
      - "COMFYUI_HOST=0.0.0.0"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
