name: DAX Control Plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 openssl jq stat shellcheck

      - name: Bash Syntax Check
        run: |
          set -euo pipefail
          for f in $(find . -maxdepth 3 -type f -name '*.sh' ! -path './dax-control-plane/*'); do
            echo "Checking syntax: $f"
            bash -n "$f"
          done

      - name: ShellCheck Static Analysis
        run: |
          set -euo pipefail
          echo "Running ShellCheck on all shell scripts..."
          shellcheck -x -S error start.sh dax.sh lib/*.sh agents/*/adapters/*.sh tests/*.sh || {
            echo "ShellCheck found issues. Please review the output above."
            exit 1
          }
          echo "ShellCheck passed with no errors."

      - name: Set Executable Permissions
        run: |
          chmod +x start.sh dax.sh lib/*.sh tests/*.sh

      - name: Execute Master Test Runner
        run: |
          ./tests/run_tests.sh
