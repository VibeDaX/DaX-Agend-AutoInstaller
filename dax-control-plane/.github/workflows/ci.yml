name: DAX Control Plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 openssl jq stat

      - name: Set Executable Permissions
        run: |
          chmod +x start.sh dax.sh lib/*.sh tests/*.sh

      - name: Execute Master Test Runner
        run: |
          ./tests/run_tests.sh
