name: "dax-ubuntu-gpu"
os: "ubuntu"
ram: 16384
cpus: 8
disk: 120
network: "default"
iso: "/isos/ubuntu-24.04.iso"
gpu:
  passthrough: true
  vendor: "nvidia"
cloud_init:
  enable: true
  user: "dax"
  ssh_authorized_keys:
    - "ssh-ed25519 AAAA..."
post_install:
  - "apt update && apt install -y docker.io nvidia-container-toolkit"
