version: 1

classes:
  agent_data:
    default_mode: rw
    backup: daily
    quota: 10G

  cache:
    default_mode: rw
    backup: none
    quota: 5G

volumes:
  hermes_data:
    class: agent_data
    path_host: "/var/lib/dax/hermes"
    path_container: "/opt/hermes/data"
    type: docker_bind
    owner: "daxagent"
    mode: rw

  openclaw_data:
    class: agent_data
    path_host: "/var/lib/dax/openclaw"
    path_container: "/opt/openclaw/data"
    type: docker_bind
    owner: "daxagent"
    mode: rw

  ollama_data:
    class: cache
    path_host: "/var/lib/dax/ollama"
    path_container: "/opt/ollama/models"
    type: docker_bind
    owner: "daxagent"
    mode: rw
